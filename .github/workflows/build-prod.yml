name: Build and Deploy Production

on:
  workflow_run:
    workflows: ["Build and Deploy QA"]
    types: [completed]

permissions:
  id-token: write
  contents: read

env:
  VERSION: "1.0.${{ github.run_number }}"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.GH_ACTIONS_AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.PROD_AZURE_SUBSCRIPTION_ID }}
  CONTAINER_REGISTRY: "crnono.azurecr.io"
  CONTAINER_IMAGE: "crnono.azurecr.io/wasatch-custom-basements/frontend-site"
  CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
  CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
  TF_VAR_container_registry_username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
  TF_VAR_container_registry_password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
  TFSTATE_RESOURCE_GROUP: rg-tfstate-prod
  TFSTATE_STORAGE_ACCOUNT: stdevnonorojotfstate
  TFSTATE_CONTAINER: tfstate
  TFSTATE_KEY: terraform.state.az.wasatch-container-app-prod.statefiles
  TF_VAR_environment: prod
  TF_VAR_workload_profile_name: "Consumption"
  TF_VAR_workload_profile_type: "Consumption"
  TF_VAR_container_app_cpu: ${{ vars.PROD_CONTAINER_APP_CPU || '0.25' }}
  TF_VAR_container_app_memory: ${{ vars.PROD_CONTAINER_APP_MEMORY || '0.5Gi' }}
  TF_VAR_container_image: "crnono.azurecr.io/wasatch-custom-basements/frontend-site:1.0.${{ github.run_number }}"

defaults:
  run:
    working-directory: terraform/src

jobs:
  terraform:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.GH_ACTIONS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PROD_AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event.workflow_run.event == 'pull_request'
        run: terraform plan -input=false

      - name: Terraform apply
        if: github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
        run: terraform apply -input=false -auto-approve
