name: Pull Request Validation

on:
  pull_request:
    paths:
      - "*"

permissions:
  id-token: write
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.GH_ACTIONS_AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.DEV_AZURE_SUBSCRIPTION_ID }}
  TFSTATE_RESOURCE_GROUP: rg-tfstate-dev
  TFSTATE_STORAGE_ACCOUNT: stdevnonorojotfstate
  TFSTATE_CONTAINER: tfstate
  TFSTATE_KEY: terraform.state.az.wasatch-container-app-dev.statefiles
  TF_VAR_environment: dev
defaults:
  run:
    working-directory: src/container-app-environment

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: ${{ github.workspace }}
        run: docker build --tag wasatch-custom-basements:pr .

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.GH_ACTIONS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEV_AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # The backend block is empty, so it is configured here.
      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false
