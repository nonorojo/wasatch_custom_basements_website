name: Build and Deploy Dev

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "terraform/src/**"
      - ".github/workflows/build-dev.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - ".dockerignore"
      - "terraform/src/**"
      - ".github/workflows/build-dev.yml"

permissions:
  id-token: write
  contents: read

env:
  VERSION: "1.0.${{ github.run_number }}"
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.GH_ACTIONS_AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.DEV_AZURE_SUBSCRIPTION_ID }}
  CONTAINER_REGISTRY: "crnono.azurecr.io"
  CONTAINER_IMAGE: "crnono.azurecr.io/wasatch-custom-basements/frontend-site"
  CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
  CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
  TF_VAR_container_registry_username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
  TF_VAR_container_registry_password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
  TFSTATE_RESOURCE_GROUP: rg-tfstate-dev
  TFSTATE_STORAGE_ACCOUNT: stdevnonorojotfstate
  TFSTATE_CONTAINER: tfstate
  TFSTATE_KEY: terraform.state.az.wasatch-container-app-dev.statefiles
  TF_VAR_environment: dev
  TF_VAR_workload_profile_name: "Consumption"
  TF_VAR_workload_profile_type: "Consumption"
  TF_VAR_container_app_cpu: ${{ vars.DEV_CONTAINER_APP_CPU || '0.25' }}
  TF_VAR_container_app_memory: ${{ vars.DEV_CONTAINER_APP_MEMORY || '0.5Gi' }}
  TF_VAR_container_image: "crnono.azurecr.io/wasatch-custom-basements/frontend-site:1.0.${{ github.run_number }}"

defaults:
  run:
    working-directory: terraform/src

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ env.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ env.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.CONTAINER_IMAGE }}:${{ env.VERSION }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.GH_ACTIONS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEV_AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # The backend block is empty, so it is configured here.
      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$TFSTATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TFSTATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TFSTATE_CONTAINER" \
            -backend-config="key=$TFSTATE_KEY"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name == 'pull_request'
        run: terraform plan -input=false

      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve
